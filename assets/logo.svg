<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MoodBook">
  <defs>
    <linearGradient id="mb-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB28C"/>
      <stop offset="0.55" stop-color="#B29EFF"/>
      <stop offset="1" stop-color="#78D6BA"/>
    </linearGradient>
    <linearGradient id="mb-hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mb-g)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mb-hl)"/>
  <!-- pages that read as an equalizer: an open book seen from above -->
  <g fill="#fff">
    <rect x="14" y="26" width="5" height="12" rx="2.5" opacity="0.85"/>
    <rect x="22" y="20" width="5" height="24" rx="2.5" opacity="0.95"/>
    <rect x="30" y="14" width="4" height="36" rx="2"/>
    <rect x="37" y="20" width="5" height="24" rx="2.5" opacity="0.95"/>
    <rect x="45" y="26" width="5" height="12" rx="2.5" opacity="0.85"/>
  </g>
</svg>
